<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Micrio parallax demo — winter house</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, user-scalable=no"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050914;
      }
      micr-io {
        display: block;
        width: 100%;
        height: 100%;
      }
      #info {
        position: fixed;
        bottom: 12px;
        left: 12px;
        z-index: 1000;
        background: rgba(10, 14, 25, 0.82);
        color: #eee;
        font:
          13px/1.5 -apple-system,
          sans-serif;
        padding: 10px 14px;
        border-radius: 8px;
        max-width: 320px;
        pointer-events: none;
      }
      #info b {
        color: #7fd0ff;
      }
      #info table {
        border-collapse: collapse;
        margin-top: 6px;
      }
      #info td {
        padding: 1px 8px 1px 0;
        font-size: 12px;
        color: #ccc;
      }
      #info td.n {
        color: #9cf;
        text-align: right;
      }
    </style>
    <script src="./fps.js" defer></script>
    <!-- Swap to /dist/micrio.min.js (after `npm run build`) to test the mangled
         production bundle. Note `/dist/`, not `../public/dist/` — public/ is Vite's
         publicDir, served at the root. -->
    <script type="module" src="../src/main.ts"></script>
  </head>
  <body>
    <div id="info">
      <b>Parallax POC — 7-layer scene</b><br />
      Drag to pan / scroll to zoom.<br />
      Click a lit window to open it.
      <table id="layerTable"></table>
      <button id="cycleSign" style="margin-top: 8px; pointer-events: auto">
        Cycle sign state
      </button>
    </div>
    <!-- data-ui="markers" renders markers only, with noUI keeping all other chrome off
         (main.ts:246). -->
    <micr-io data-ui="markers"></micr-io>

    <script type="module">
      customElements.whenDefined("micr-io").then(async () => {
        const micrio = document.querySelector("micr-io");
        const tileBase = new URL("./tiles/", location.href).href;

        // Canvas space is the base "sky" image: gradient.png pre-cropped to its bottom
        // 70% (940x1326 -> 940x928), which centres the house at default framing.
        const CW = 940,
          CH = 928;

        const info = (id, w, h, ext = "png") => ({
          id,
          path: tileBase,
          version: "7.1.2",
          width: w,
          height: h,
          tileSize: 20000, // big enough to always resolve to one untiled layer
          isSingle: true,
          tileExtension: ext,
        });

        // Derived from the three.js scene (mccal-demo/assets/scene.glb): a perspective
        // camera at z=8 with each layer an X-rotated plane at its own z. `area` is the
        // node's world rect magnified by 8/(8-z) and projected onto the gradient plane,
        // then rebased onto the cropped canvas. `parallax` is (8-z_house)/(8-z), so the
        // house is 1.0 and stays put under the cursor. Ordered back to front by z.
        // Areas past [0,1] are correct — foreground layers overflow the frame.
        const layers = [
          // id      w     h     area [x, y, w, h]                        parallax  label
          [
            "trees",
            940,
            1326,
            [0.0061, -0.4332, 0.9894, 1.4135],
            0.925,
            "trees",
          ],
          ["house", 1762, 626, [-0.2217, 0.3535, 1.3086, 0.4708], 1.0, "house"],
          [
            "snow",
            1207,
            198,
            [-0.1016, 0.9104, 1.1525, 0.1915],
            1.04,
            "snow drift",
          ],
          ["door", 1721, 550, [-0.1146, 0.5885, 1.2696, 0.4109], 1.084, "door"],
          [
            "gates",
            1073,
            290,
            [0.1135, 0.7631, 0.7957, 0.2178],
            1.183,
            "gate posts",
          ],
          [
            "snowman",
            241,
            252,
            [0.6055, 0.8849, 0.1553, 0.1644],
            1.255,
            "snowman",
          ],
        ];

        // How far past the canvas edges the camera may roam. Generous above (only sky),
        // slim below (panning past the edge shows the underside of the snow).
        const PAN_PAD = { x: 0.18, top: 0.25, bottom: 0.08 };

        const image = await micrio.open({
          id: "sky",
          info: info("sky", CW, CH, "png"),
          settings: {
            noUI: true,
            noLogo: true,
            // 1x native res is too low here: fitting a 940px image on a Retina display
            // already needs upscaling, and the marker fly-to below needs ~6x. The art is
            // the real ceiling — the house layer upscales ~4x at that framing.
            zoomLimit: 8,
            _markers: { zoomOutAfterClose: true },
            view: [0.09, 0.19, 0.82, 0.82],
            // Wide but real bounds. `restrict` isn't clamped to [0,1] and a limit wider
            // than the image leaves zoom untouched (camera-2d.ts:158). The art doesn't
            // reach into this margin yet, so the body background shows at the extremes.
            restrict: [
              -PAN_PAD.x,
              -PAN_PAD.top,
              1 + PAN_PAD.x * 2,
              1 + PAN_PAD.top + PAN_PAD.bottom,
            ],
          },
        });

        const table = document.getElementById("layerTable");
        table.insertAdjacentHTML(
          "beforeend",
          `<tr><td>sky (base)</td><td class="n">1.00</td></tr>`,
        );

        // 'gates' is marked target:'front' to demo the back/front canvas sandwich: it now
        // paints above the DOM/UI layer (markers, popups) sandwiched between the two
        // canvases, instead of always sitting behind it like every other GL layer here.
        for (const [id, w, h, area, parallax, label] of layers) {
          image.addEmbed(info(id, w, h, "png"), {}, area, {
            opacity: 1,
            parallax,
            isPassiveSecondary: true,
            target: (id === "gates") | (id === "snowman") ? "front" : "back",
          });
          table.insertAdjacentHTML(
            "beforeend",
            `<tr><td>${label}${parallax === 1 ? " (ref)" : ""}${id === "gates" ? " [front]" : ""}</td><td class="n">${parallax.toFixed(2)}</td></tr>`,
          );
        }

        // Flying bees: 5 video embeds at random spots, each with its own parallax
        // depth. `image.addEmbed()` (used for the layers above) is the only embed
        // path that accepts a `parallax` factor, but it only prepares a GL texture
        // slot -- nothing feeds it video frames. That wiring (video element ->
        // `image.video` store -> `dataset.playing` -> `engine._setImageVideoPlaying`)
        // normally happens inside the library's data.embeds/#printInsideGL path,
        // which *doesn't* take a parallax option. So it's redone by hand here to get
        // a video embed that also parallaxes.
        const BEE_W = 565,
          BEE_H = 674; // native asset px
        const beeBase = new URL("./assets/", location.href).href;

        for (let n = 0; n < 5; n++) {
          const dispW = 55 + Math.random() * 45; // on-canvas px width
          const w = dispW / CW;
          const h = (dispW * (BEE_H / BEE_W)) / CH;
          const x = 0.04 + Math.random() * (0.92 - w);
          const y = 0.06 + Math.random() * (0.8 - h);
          const parallax = 0.85 + Math.random() * 0.55; // mirrors the layer depths above

          const bee = image.addEmbed(
            {
              id: `bee-${n}`,
              path: beeBase,
              width: BEE_W,
              height: BEE_H,
              isSingle: true,
              isVideo: true,
            },
            {},
            [x, y, w, h],
            { opacity: 1, parallax, isPassiveSecondary: true },
          );

          const vid = document.createElement("video");
          vid.muted = true;
          vid.loop = true;
          vid.autoplay = true;
          vid.playsInline = true;
          vid.crossOrigin = "anonymous";
          for (const [src, type] of [
            [beeBase + "bee.webm", "video/webm"],
            [beeBase + "bee.mp4", "video/mp4"],
          ]) {
            const source = document.createElement("source");
            source.src = src;
            source.type = type;
            vid.append(source);
          }
          vid.addEventListener(
            "playing",
            () => {
              vid.dataset.playing = "1";
              bee.video.set(vid);
              image.engine._setImageVideoPlaying(bee, true);
              image.engine.render();
            },
            { once: true },
          );
          vid.play().catch(() => {});

          table.insertAdjacentHTML(
            "beforeend",
            `<tr><td>bee ${n + 1}</td><td class="n">${parallax.toFixed(2)}</td></tr>`,
          );
        }

        // "Sign" embed: demos cycling a GL embed's texture on click via
        // image.addEmbed(..., { states }) + embed.nextState() — two static images and a
        // video, cycled by the "Cycle sign state" button. The initial 'door' tile pyramid
        // is only scaffolding: addEmbed's state controller immediately force-reloads the
        // first configured state on top of it.
        const sign = image.addEmbed(
          {
            id: "sign",
            path: tileBase,
            version: "7.1.2",
            width: 300,
            height: 300,
            tileSize: 20000,
            isSingle: true,
            tileExtension: "png",
          },
          {},
          [0.55, 0.74, 0.09, 0.09],
          {
            opacity: 1,
            isPassiveSecondary: true,
            states: [
              { src: beeBase + "3-door.png" },
              { src: beeBase + "4-gates.png" },
              {
                width: BEE_W,
                height: BEE_H,
                video: {
                  title: "bee",
                  src: beeBase + "bee.webm",
                  size: 0,
                  uploaded: 0,
                  width: BEE_W,
                  height: BEE_H,
                  duration: 0,
                  muted: true,
                  loop: true,
                  autoplay: true,
                  controls: false,
                  transparent: false,
                },
              },
            ],
          },
        );
        document.getElementById("cycleSign").addEventListener("click", () => {
          sign.nextState();
        });

        // Window rects, found by clustering the amber glass pixels in 2-house.png and
        // mapping through the house layer's area. They need no parallax handling because
        // the house is the 1.0 reference; markers on any other layer would drift.
        // Content mirrors mccal-demo/assets/data-model.json's windows[].position.
        const windows = [
          {
            n: 1,
            rect: [0.0991, 0.5099, 0.2061, 0.5821],
            type: "deal",
            title: "Donken Meals for 50 SEK",
            body: "Come back to unlock this gift",
            label: "Friday",
          },
          {
            n: 2,
            rect: [0.8062, 0.5159, 0.9072, 0.5821],
            type: "teaser",
            title: "A Home Alone Themed Cup",
            body: "Come back to unlock this gift",
            label: "Coming soon",
          },
          {
            n: 3,
            rect: [0.0991, 0.6543, 0.2061, 0.7446],
            type: "easterEgg",
            title: "It is Hamburglar!",
            body: "Tap to see who is there — keep exploring",
            label: "Easter egg",
          },
          {
            n: 4,
            rect: [0.8121, 0.6543, 0.9072, 0.7446],
            type: "placeholder",
            title: "Nothing to see here",
            body: "Keep exploring",
            label: "Empty",
          },
        ];

        // Facade kept around a window when zoomed in, per side, as a fraction of it.
        const ZOOM_PAD = 0.8;

        image.data.set({
          markers: windows.map((w) => {
            const [x0, y0, x1, y1] = w.rect;
            const rw = x1 - x0,
              rh = y1 - y0;
            return {
              id: `window-${w.n}`,
              x: (x0 + x1) / 2,
              y: (y0 + y1) / 2,
              // A view is [x, y, w, h], not two corners.
              view: [
                x0 - rw * ZOOM_PAD,
                y0 - rh * ZOOM_PAD,
                rw * (1 + 2 * ZOOM_PAD),
                rh * (1 + 2 * ZOOM_PAD),
              ],
              type: "default",
              data: { showTitle: false },
              i18n: {
                en: {
                  title: w.title,
                  body: `<p>${w.body}</p><p><small>window ${w.n} · ${w.type}</small></p>`,
                  label: w.label,
                },
              },
            };
          }),
        });

        window.__demoImage = image; // for console poking
      });
    </script>
  </body>
</html>
